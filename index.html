<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/style.css">

    <title>Jovi Lens</title>
</head>
<body>
    <h1>Jovi Lens BETA</h1>
    <div class="Celular">
        <nav class="nav-hero">
            <h6>JOVI V70 - JOVI LENS Techbuilders</h6>
        </nav>
        <div class="aviso-esquerda">
            <h5>Aviso<br>Clique nos icones e um alert explicativo será ativo</h5>
        </div>
        <div class="barra-status">
            <p class="horario">09:30</p>
            <div class="cam">
                <i class="fa-solid fa-circle" alt="Camera do celular V70"></i>
            </div>
            <div class="direita">
            <p class="dados">5G</p>
            <i class="fa-solid fa-battery-full" alt="Bateria do celular V70"></i>
            </div>
        </div>
    <header class="hero">
        <img src="./images/vivoon.png" class="icon" alt="Icone do JOVI Lens/Vivo On" id="vivoon">
        <i class="fa-solid fa-bolt icon" id="flash" alt="Icone de um trovão para flash"></i>
        <i class="fa-regular fa-clock icon" id="relogio" alt="Icone de um temporizador"></i>
        <i class="fa-solid fa-gear icon" id="configuracoes" alt="Icone de uma engrenagem para configurações"></i>
    </header>
        </div>
        <main class="foto">
            <div class="imagem" id="imagem">
            <img src="./images/foto.jpg" alt="Foto de um ambiente florestral em primavera" id="foto">
            </div>
        </main>
        <header class="barra-foto">
            <div class="area-baixo">
                <div class="foto-passada" id="galeria">
                    <img src="./images/maca.jpg" alt="Galeria com a foto de uma maçã">
                </div>
                
                <div class="tirar-foto">
                    <i class="fa-solid fa-circle-dot"></i>
                </div>
                <div class="rotacionar" id="rotacionar">
                    <i class="fa-solid fa-rotate" style="color: rgb(255, 255, 255);"></i>
                </div>
        </header>

</body>
<script src="./js/script.js"></script>
</html>
